    <script>
    (() => {
        const screen = document.getElementById('entranceScreen');
        const openButton = document.getElementById('entranceOpen');
        const loadingText = document.getElementById('entranceLoading');
        if (!screen || !openButton || !loadingText) return;


        const phrase = 'kenchie kenchie kenchie kenchie';
        let index = 0;
        openButton.disabled = true;
        openButton.setAttribute('aria-disabled', 'true');
        const typeNext = () => {
            index += 1;
            loadingText.textContent = phrase.slice(0, index);
            if (index < phrase.length) {
                window.setTimeout(typeNext, 95);
            } else {
                loadingText.classList.add('is-ready');
                openButton.disabled = false;
                openButton.removeAttribute('aria-disabled');
                openButton.textContent = 'OPEN';
                openButton.classList.add('is-ready');
            }
        };
        loadingText.textContent = '';
        window.setTimeout(typeNext, 450);

        openButton.addEventListener('click', () => {
            if (openButton.disabled) return;
            document.body.classList.remove('entrance-locked');
            document.body.classList.add('entrance-opened');
            screen.classList.add('entrance-leaving');

            // Start the background music directly from the OPEN click.
            const backgroundMusic = document.getElementById('backgroundMusic');
            if (backgroundMusic) {
                backgroundMusic.volume = 0.45;
                const playback = backgroundMusic.play();
                if (playback && typeof playback.catch === 'function') {
                    playback.catch(() => {
                        // If playback is blocked, the next user interaction can retry it.
                    });
                }
            }

            window.setTimeout(() => screen.remove(), 850);
        });
    })();
    </script>
    <script>
    (() => {
        document.addEventListener('contextmenu', (event) => event.preventDefault());
        document.addEventListener('keydown', (event) => {
            const key = (event.key || '').toLowerCase();
            const blocked = key === 'f12' ||
                (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(key)) ||
                (event.ctrlKey && ['u', 's'].includes(key)) ||
                (event.metaKey && event.altKey && ['i', 'j', 'c'].includes(key)) ||
                (event.metaKey && ['u', 's'].includes(key));
            if (blocked) {
                event.preventDefault();
                event.stopPropagation();
            }
        }, true);
    })();
    </script>
    <script src="home.js"></script>
